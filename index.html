<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        #fwCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 3.5rem;
            color: #fb6f92;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 5px;
            animation: bounce 2s infinite alternate;
        }

        .subtitle {
            font-size: 2rem;
            font-weight: bold;
            color: #ff527b;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        button {
            background-color: #fb6f92;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(251, 111, 146, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #ff527b;
            transform: scale(1.05);
        }

        .stage {
            position: relative;
            width: 300px;
            height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nose {
            position: absolute;
            top: 20px;
            width: 140px;
            height: auto;
            z-index: 3;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nose.show {
            opacity: 1;
            transform: scale(1);
        }

        .birthday-girl {
            position: absolute;
            top: 90px;
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #81c784;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            z-index: 1; 
            opacity: 0;
            transform: scale(0.2) translateY(0);
            transition: all 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .birthday-girl.booger-drop {
            opacity: 1;
            transform: scale(1.2, 1.3) translateY(120px); 
            z-index: 4;
        }

        /* 📦 Floating Container for text + QR code */
        .qr-box {
            display: none; /* Hidden by default */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100; /* Puts it on top of everything */
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 280px;
            width: 85%;
        }

        /* 📝 Styled Text Header above the QR Code */
        .donate-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #007ace; /* Clean blue color accent */
            margin-bottom: 12px;
        }

        .qr-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <canvas id="fwCanvas"></canvas>

    <audio id="cheerAudio" src="photos/cheer.mp3"></audio>

    <!-- 📦 Combined Pop-up Window -->
    <div id="qrBoxContainer" class="qr-box">
        <p class="donate-text">💥 Donate to our cause 💥</p>
        <img src="photos/gcash_qr.jpg" alt="GCash QR Code" class="qr-image">
    </div>

    <div class="container">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p class="subtitle">MARGIE</p>
        
        <button id="actionBtn">Click for a Surprise!</button>
        
        <div class="stage">
            <img src="photos/nose.png" alt="Nose" id="noseImg" class="nose">
            <img src="photos/birthday_girl.jpg" alt="Birthday Girl" id="girlImg" class="birthday-girl">
        </div>
    </div>

    <script>
        const button = document.getElementById('actionBtn');
        const nose = document.getElementById('noseImg');
        const girl = document.getElementById('girlImg');
        const canvas = document.getElementById('fwCanvas');
        const cheerSound = document.getElementById('cheerAudio'); 
        const qrBoxContainer = document.getElementById('qrBoxContainer'); // Targeted box wrapper
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let fireworksActive = false;

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.08;
                this.alpha -= this.decay;
            }
        }

        function spawnFirework() {
            if (!fireworksActive) return;
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.6);
            const colors = ['#ff527b', '#fb6f92', '#ffc2d1', '#fff', '#81c784', '#ffeb3b'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(x, y, randomColor));
            }
            setTimeout(spawnFirework, Math.random() * 400 + 200);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    p.update();
                    p.draw();
                }
            });
            requestAnimationFrame(animate);
        }

        button.addEventListener('click', () => {
            cheerSound.load(); 

            nose.classList.add('show');

            setTimeout(() => {
                girl.classList.add('booger-drop');
                
                setTimeout(() => {
                    fireworksActive = true;
                    spawnFirework();
                    animate();

                    cheerSound.play().catch(error => console.log("Audio play blocked: ", error));

                    setTimeout(() => {
                        fireworksActive = false;
                    }, 30000);

                }, 1500);

            }, 600);

            // ⏱️ Reveal text and QR code box at 30 seconds
            setTimeout(() => {
                qrBoxContainer.style.display = 'block';
            }, 30000);

            button.style.display = 'none';
        });
    </script>

</body>
</html>
